# Run from the repo root:
#   docker compose -f deploy/docker-compose.yaml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: depscan
      POSTGRES_PASSWORD: depscan
      POSTGRES_DB: depscan
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depscan -d depscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://depscan:depscan@postgres:5432/depscan?sslmode=disable
    ports:
      - "80:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
