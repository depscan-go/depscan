# depscan policy configuration
# ---------------------------------------------------------
# This file controls what the scanner blocks, warns about,
# and allows. Commit this file to your repo so every scan
# — local or CI — uses the same rules.
#
# Docs: https://github.com/depscan-go/depscan/blob/main/README.md


# ---------------------------------------------------------
# VULNERABILITY SEVERITY
# ---------------------------------------------------------
# Severities that cause the scan to EXIT 1 (fails CI).
# Valid values: CRITICAL, HIGH, MODERATE, MEDIUM, LOW, UNKNOWN
#
# Recommendation for production services: block CRITICAL + HIGH
# Recommendation for libraries: block CRITICAL only (less strict)
block_severities:
  - CRITICAL
  - HIGH

# Severities that print a warning but do NOT fail the scan.
# These show up in the output so developers are aware.
warn_severities:
  - MODERATE
  - MEDIUM

# UNKNOWN means OSV has no CVSS score for the vuln yet.
# Set to true to block these too (stricter). Default: false.
block_unknown_severity: false


# ---------------------------------------------------------
# DEPENDENCY SCOPE
# ---------------------------------------------------------
# If true, transitive (indirect) dependencies are also scanned.
# If false, only packages you directly import are checked.
#
# Recommendation: true — attacks come through transitive deps too.
check_transitive: true


# ---------------------------------------------------------
# LICENSES
# ---------------------------------------------------------
# Licenses that are NOT allowed in this project.
# Uses SPDX identifiers: https://spdx.org/licenses/
#
# Why this matters: using a GPL dependency in a commercial or
# permissively-licensed project can create legal obligations.
#
# Common safe licenses (allow these): MIT, Apache-2.0, BSD-2-Clause,
# BSD-3-Clause, ISC, MPL-2.0, CC0-1.0
#
# Commonly denied in permissive/commercial projects:
denied_licenses:
  - GPL-2.0
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-1.0
  - AGPL-3.0
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - SSPL-1.0       # MongoDB's license — very restrictive
  - BUSL-1.1       # Business Source License — not OSI approved
  - CC-BY-NC-4.0   # Non-commercial restriction


# ---------------------------------------------------------
# EXCEPTIONS (allowlist)
# ---------------------------------------------------------
# Specific vulnerabilities to ignore — for example, a CVE that
# doesn't affect your usage of the package, or one you've
# accepted the risk on with a justification.
#
# Format:
#   - id: GHSA-xxxx-xxxx-xxxx   # the vuln ID from OSV
#     reason: "explain why"      # required — forces accountability
#     expires: "2025-12-31"      # optional — auto-unignore after date
exceptions:
  []
  # Example:
  # - id: GHSA-2c4m-59x9-fr2g
  #   reason: "FileAttachment is not used in this project"
  #   expires: "2025-06-01"


# ---------------------------------------------------------
# FAIL BEHAVIOUR
# ---------------------------------------------------------
# If true, the scan exits 1 as soon as the first violation is
# found. If false, it runs the full scan and reports everything.
# Recommendation: false — see all problems at once.
fail_fast: false

# Maximum number of violations before the scan exits early,
# even when fail_fast is false. 0 = no limit.
max_violations: 0