name: CI

# Run on every PR, and on every push to main
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repo
permissions:
  contents: read

# Cancel an older run of the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the store's tests, on the same major version as Neon
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: depscan
        ports:
          - 5432:5432
        # Over TCP: during its first start the image serves only the Unix socket
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DEPSCAN_TEST_DATABASE_URL: postgres://postgres:depscan@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      # Installs the Go version from go.mod, so it is defined in one place only
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, so a new linter release can't turn CI red by itself. Bump it on purpose.
          version: v2.14.0

  docker:
    # Only build the image if tests and lint passed
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # push: false -> only checks that the image builds (publishing comes later)
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
