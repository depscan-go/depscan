name: Nightly

# Runs the end-to-end tests (e2e/) every night and on demand from the Actions tab.
# They catch what unit tests can't: broken wiring, changes in OSV.dev and deps.dev
# data, and the live app being down.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 in India
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: End-to-end tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: e2e/run.sh --all

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/results/
