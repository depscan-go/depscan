name: Upkeep

# Weekly housekeeping: reminder issues for infra/expiry.yaml, an Azure spending check, and
# re-enabling the scheduled workflows so GitHub doesn't pause them.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 08:30 in India
  workflow_dispatch:
    inputs:
      soon_days:
        description: "Remind about items due within this many days"
        default: "30"
      cost_limit:
        description: "Open an issue when this month's Azure spend (INR) is over this"
        default: "400"

permissions:
  contents: read
  issues: write # reminder issues
  actions: write # re-enable scheduled workflows
  id-token: write # azure/login over OIDC

concurrency:
  group: upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Reminders
        env:
          SOON_DAYS: ${{ inputs.soon_days }}
        run: .github/scripts/remind.sh infra/expiry.yaml "${SOON_DAYS:-30}"

      - uses: azure/login@v3
        if: ${{ !cancelled() }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure spending check
        if: ${{ !cancelled() }}
        env:
          COST_LIMIT: ${{ inputs.cost_limit }}
        run: .github/scripts/spend.sh "${COST_LIMIT:-400}"

      # GitHub pauses scheduled workflows in public repos after 60 days without activity.
      # This runs even when a step above failed: if it stops, every scheduled check stops with it.
      - name: Keep scheduled workflows enabled
        if: ${{ !cancelled() }}
        run: |
          for wf in nightly.yaml watchdog.yaml upkeep.yaml uptime.yaml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable"
            echo "enabled $wf"
          done
